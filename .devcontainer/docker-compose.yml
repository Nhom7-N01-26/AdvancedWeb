version: '3.8'

services:
  app:
    image: mcr.microsoft.com/devcontainers/javascript-node:1-20-bullseye
    volumes:
      - ..:/workspaces/${localWorkspaceFolderBasename:-AdvancedWeb}:cached
    command: sleep infinity
    network_mode: service:db

  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: novel_manager
      MYSQL_USER: novel_user
      MYSQL_PASSWORD: novel_password
    ports:
      - "3306:3306"
      - "3000:3000"
    volumes:
      - mysql-data:/var/lib/mysql
      - ../sql_nhom_7.sql:/docker-entrypoint-initdb.d/init.sql:ro

volumes:
  mysql-data:
