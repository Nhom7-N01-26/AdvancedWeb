services:
  app:
    image: mcr.microsoft.com/devcontainers/base:debian
    command: sleep infinity
    volumes:
      - ..:/workspaces/${localWorkspaceFolderBasename}:cached
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_USERNAME: novel_user
      DB_PASSWORD: novel_password
      DB_DATABASE: novel_manager

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: local-root-password
      MYSQL_DATABASE: novel_manager
      MYSQL_USER: novel_user
      MYSQL_PASSWORD: novel_password
    volumes:
      - mysql-data:/var/lib/mysql
      - ../sql_nhom_7.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql-data: